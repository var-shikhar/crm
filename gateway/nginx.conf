# API gateway: the only published entry point. Serves the web UI and routes
#   /auth/*  -> auth-service      /crm/* -> customer-service      /audit/* -> audit-service
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;
    access_log off;   # each service writes its own structured access log
    client_max_body_size 1m;

    # Writable paths for a read-only, non-root container.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Brute-force damping on the token endpoint, per client IP.
    limit_req_zone $binary_remote_addr zone=token:10m rate=5r/s;
    limit_req_status 429;

    upstream auth_service     { server auth-service:8000; }
    upstream customer_service { server customer-service:8000; }
    upstream audit_service    { server audit-service:8000; }

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /gateway-healthz { return 200 "ok\n"; }

        # Service-to-service endpoints are not reachable from outside.
        location /auth/api/v1/authz/  { return 404; }
        location = /auth/oauth/introspect { return 404; }
        location /audit/api/v1/events/batch { return 404; }

        location = /auth/oauth/token {
            limit_req zone=token burst=10 nodelay;
            proxy_pass http://auth_service/oauth/token;
        }
        location /auth/  { proxy_pass http://auth_service/; }
        location /crm/   { proxy_pass http://customer_service/; }
        location /audit/ { proxy_pass http://audit_service/; }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        }
    }
}
